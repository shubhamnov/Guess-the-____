name: Browser smoke tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate photo catalogs
        run: python3 scripts/validate_catalogs.py
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test the local copy
        if: github.event_name != 'workflow_run'
        run: npm run test:browser
      - name: Test the published site
        if: github.event_name == 'workflow_run'
        env:
          BASE_URL: https://shubhamnov.github.io/Guess-the-____/
        run: npm run test:browser
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
