name: Cache cuisine photos

on:
  push:
    paths:
      - "catalogs/cuisines-v1.json"
      - "scripts/cache_cuisine_images.py"
      - ".github/workflows/cache-cuisine-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-and-cache:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check Pillow requests
      - name: Download and optimize cuisine photos
        run: python scripts/cache_cuisine_images.py
      - name: Commit optimized photos and local catalog paths
        run: |
          if [ -z "$(git status --porcelain -- assets/cuisines catalogs/cuisines-v1.json)" ]; then
            echo "No cuisine image or catalog changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cuisines catalogs/cuisines-v1.json
          git commit -m "Cache optimized cuisine photos locally"
          git pull --rebase origin main
          git push
