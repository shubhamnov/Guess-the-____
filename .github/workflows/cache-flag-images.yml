name: Cache flag images

on:
  push:
    paths:
      - "daily-challenge-data-v1.js"
      - "scripts/cache_flag_images.py"
      - ".github/workflows/cache-flag-images.yml"
      - "daily-challenge/index.html"
      - "guess-the-flag/index.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-and-cache:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check Pillow requests
      - name: Download and optimize flags
        run: python scripts/cache_flag_images.py
      - name: Commit optimized flags
        run: |
          if git diff --quiet; then
            echo "No flag asset changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/flags
          git commit -m "Cache optimized flag images locally"
          git push
