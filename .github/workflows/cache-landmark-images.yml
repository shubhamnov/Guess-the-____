name: Cache landmark photos

on:
  push:
    paths:
      - "catalogs/landmarks-v1.json"
      - "scripts/cache_landmark_images.py"
      - ".github/workflows/cache-landmark-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-and-cache:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check Pillow requests
      - name: Download and optimize landmark images
        run: python scripts/cache_landmark_images.py
      - name: Commit optimized images and local catalog paths
        run: |
          if git diff --quiet; then
            echo "No image or catalog changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/landmarks catalogs/landmarks-v1.json
          git commit -m "Cache optimized landmark photos locally"
          git push
