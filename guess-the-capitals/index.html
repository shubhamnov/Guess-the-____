<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f7f2">
<meta name="description" content="Name the world's capital cities in a quick multiple-choice quiz.">
<title>Guess the Capital Cities — Guess the ____</title>
<link rel="stylesheet" href="../shared/quiz.css">
<script defer src="../shared/quiz.js"></script>
</head>
<body data-game="capitals">
<main class="shell">
  <header class="top">
    <a class="brand" href="../">GUESS THE <span>?</span></a>
    <div class="top-actions"><div class="pill" id="categoryPill">CAPITALS</div><button class="sound-toggle" id="soundToggle" type="button" aria-label="Toggle sound" aria-pressed="true">♫ SOUND ON</button></div>
  </header>
  <section class="intro" id="intro">
    <div class="hero"><div class="eyebrow" id="eyebrow"></div><h1 id="pageTitle">Know your<br><em>capitals?</em></h1><p id="introText"></p></div>
    <div class="preview" id="introPreview" aria-hidden="true"></div>
    <button class="primary" id="startBtn">Let’s play <span class="arrow">→</span></button>
    <div class="micro" id="introNote"></div>
    <nav class="games-link" aria-label="More categories"><a href="../">All categories</a><span>·</span><a href="../guess-the-color/">Colors</a><span>·</span><a href="../guess-the-flag/">Flags</a><span>·</span><a href="../guess-the-countries/">Countries</a><span>·</span><a href="../guess-the-animals/">Animals</a><span>·</span><a href="../guess-the-capitals/">Capitals</a></nav>
  </section>
  <section class="game" id="game" aria-label="Guessing game">
    <div class="stats">
      <div class="stat timer" id="timerStat"><label>Time left</label><strong id="time">60</strong></div>
      <div class="stat"><label>Score</label><strong id="score">0</strong></div>
      <div class="stat"><label>Streak</label><strong id="streak">0</strong></div>
    </div>
    <div class="track" aria-hidden="true"><span id="timebar"></span></div>
    <div class="question-head"><span class="eyebrow" id="roundLabel"></span><span class="level" id="level"></span></div>
    <div class="clue" id="clue" aria-live="polite"></div>
    <p class="prompt" id="prompt"></p>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <div class="micro" id="categoryDescription"></div>
  </section>
  <section class="result" id="result">
    <div><div class="eyebrow" id="resultEyebrow"></div><div class="bigscore" id="finalScore">0</div><h2 id="resultTitle">Nice work.</h2><p id="resultText"></p></div>
    <div class="resultbox"><div><label>Personal best</label><strong id="resultBest">0</strong></div><div><label>Accuracy</label><strong id="accuracy">0%</strong></div><div><label>Correct</label><strong id="correctCount">0</strong></div><div><label>Answered</label><strong id="answeredCount">0</strong></div></div>
    <button class="primary" id="againBtn">Run it back <span class="arrow">↻</span></button>
    <button class="secondary" id="shareBtn">Share score image ↗</button>
    <nav class="games-link" aria-label="More categories"><a href="../">All categories</a><span>·</span><a href="../guess-the-color/">Colors</a><span>·</span><a href="../guess-the-flag/">Flags</a><span>·</span><a href="../guess-the-countries/">Countries</a><span>·</span><a href="../guess-the-animals/">Animals</a><span>·</span><a href="../guess-the-capitals/">Capitals</a></nav>
  </section>
  <footer class="bottomline"><span>GUESS THE ?</span><span id="footerText"></span></footer>
</main>
<div class="toast" id="toast" role="status"></div>
</body>
</html>
