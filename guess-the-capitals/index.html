<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f7f2">
<meta name="description" content="Name the capital city of each country in sixty seconds.">
<title>Guess the Capital Cities — Guess the ____</title>
<link rel="stylesheet" href="../shared/engine.css">
</head>
<body data-game="capitals">
<script src="../shared/games.js"></script>
<script src="../shared/engine.js"></script>
<script src="../shared/mode-switch.js"></script>
<script src="../shared/region.js"></script>
<script src="../data/capitals.js"></script>
<script src="../shared/world.js"></script>
<script>
const WORLD=new Map(window.GTQ_WORLD.map(c=>[c.name,c]));
const DATA=GTQ_DATA.capitals.map(([country,city])=>({country,city,code:WORLD.get(country).code,region:WORLD.get(country).region}));
const pool=GuessGame.util.deck(DATA,x=>x.country);
GuessGame.run({
 id:'capitals',label:'Capital Cities',eyebrow:'A quick world tour',titleHtml:'Know your<br><em>capitals?</em>',
 intro:'You get a country. You name its capital. Find out how much of the world map lives in your head.',
 note:DATA.length+' countries. After five warm-up questions, the wrong answers are capitals from the same continent.',
 previewHtml:'<div class="preview-row"><span class="preview-chip">TOKYO</span><span class="preview-chip">LIMA</span><span class="preview-chip">OSLO</span></div>',
 prompt:'What is the capital of this country?',legacyBest:[{key:'guessTheCapitalsBest',scale:10}],
 links:[{"text":"Flags","href":"../guess-the-flag/"},{"text":"Countries","href":"../guess-the-countries/"},{"text":"Currencies","href":"../guess-the-currencies/"}],
 onStart(){pool.reset()},
formats:['Name the capital','Name the country','Flag to capital'],
 next(ctx){
  const item=pool.draw(),level=ctx.hard?'Tricky · same continent':'Warm-up';
  const f=ctx.format(['capital','country','flag']);
  if(f==='country')return {kind:'Reverse',answer:item.country,options:ctx.util.choices(item,DATA,{answer:x=>x.country,group:x=>x.region,hard:ctx.hard}),prompt:'Which country has this capital?',level,explanation:item.city+' is the capital of '+item.country+'.',
   render(h){ctx.util.bigClue(h,item.city,'Capital city')}};
  const options=ctx.util.choices(item,DATA,{answer:x=>x.city,group:x=>x.region,hard:ctx.hard});
  if(f==='flag')return {kind:'Flag only',answer:item.city,options,prompt:'What is the capital of the country with this flag?',level,explanation:'That is the flag of '+item.country+'; its capital is '+item.city+'.',
   render(h){const img=document.createElement('img');img.className='clue-flag';img.alt='Flag of the country';img.src='../assets/flags/'+item.code+'.webp';h.appendChild(img)}};
  return {answer:item.city,options,level,explanation:item.city+' is the capital of '+item.country+'.',
   render(h){const img=document.createElement('img');img.className='clue-backdrop';img.alt='';img.src='../assets/flags/'+item.code+'.webp';img.onerror=()=>img.remove();const shade=document.createElement('div');shade.className='clue-shade';const name=document.createElement('div');name.className='clue-label';name.textContent=item.country;h.append(img,shade,name)}};
 }
});
</script>
</body>
</html>
