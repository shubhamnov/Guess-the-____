<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f7f2">
<meta name="description" content="Name the capital city of each country in sixty seconds.">
<title>Guess the Capital Cities — Guess the ____</title>
<link rel="stylesheet" href="../shared/engine.css">
</head>
<body data-game="capitals">
<script src="../shared/engine.js"></script>
<script src="../shared/world.js"></script>
<script>
const WORLD=new Map(window.GTQ_WORLD.map(c=>[c.name,c]));
const DATA=[["Afghanistan","Kabul"],["Albania","Tirana"],["Algeria","Algiers"],["Argentina","Buenos Aires"],["Armenia","Yerevan"],["Australia","Canberra"],["Austria","Vienna"],["Azerbaijan","Baku"],["Bangladesh","Dhaka"],["Belgium","Brussels"],["Bhutan","Thimphu"],["Bolivia","Sucre"],["Brazil","Brasília"],["Bulgaria","Sofia"],["Cambodia","Phnom Penh"],["Cameroon","Yaoundé"],["Canada","Ottawa"],["Chile","Santiago"],["China","Beijing"],["Colombia","Bogotá"],["Croatia","Zagreb"],["Cuba","Havana"],["Czechia","Prague"],["Denmark","Copenhagen"],["Ecuador","Quito"],["Egypt","Cairo"],["Estonia","Tallinn"],["Ethiopia","Addis Ababa"],["Finland","Helsinki"],["France","Paris"],["Georgia","Tbilisi"],["Germany","Berlin"],["Ghana","Accra"],["Greece","Athens"],["Hungary","Budapest"],["Iceland","Reykjavík"],["India","New Delhi"],["Iran","Tehran"],["Iraq","Baghdad"],["Ireland","Dublin"],["Italy","Rome"],["Jamaica","Kingston"],["Japan","Tokyo"],["Jordan","Amman"],["Kazakhstan","Astana"],["Kenya","Nairobi"],["Laos","Vientiane"],["Latvia","Riga"],["Lebanon","Beirut"],["Libya","Tripoli"],["Lithuania","Vilnius"],["Malaysia","Kuala Lumpur"],["Maldives","Malé"],["Mexico","Mexico City"],["Mongolia","Ulaanbaatar"],["Morocco","Rabat"],["Nepal","Kathmandu"],["Netherlands","Amsterdam"],["New Zealand","Wellington"],["Nigeria","Abuja"],["North Korea","Pyongyang"],["Norway","Oslo"],["Oman","Muscat"],["Pakistan","Islamabad"],["Peru","Lima"],["Philippines","Manila"],["Poland","Warsaw"],["Portugal","Lisbon"],["Qatar","Doha"],["Romania","Bucharest"],["Russia","Moscow"],["Rwanda","Kigali"],["Saudi Arabia","Riyadh"],["Senegal","Dakar"],["Serbia","Belgrade"],["Singapore","Singapore"],["Slovakia","Bratislava"],["Slovenia","Ljubljana"],["South Africa","Pretoria"],["South Korea","Seoul"],["Spain","Madrid"],["Sri Lanka","Sri Jayawardenepura Kotte"],["Sweden","Stockholm"],["Switzerland","Bern"],["Thailand","Bangkok"],["Tunisia","Tunis"],["Türkiye","Ankara"],["Ukraine","Kyiv"],["United Arab Emirates","Abu Dhabi"],["United Kingdom","London"],["United States","Washington, D.C."],["Uruguay","Montevideo"],["Uzbekistan","Tashkent"],["Venezuela","Caracas"],["Vietnam","Hanoi"],["Zimbabwe","Harare"],["Botswana","Gaborone"],["Burkina Faso","Ouagadougou"],["Costa Rica","San José"],["Dominican Republic","Santo Domingo"],["El Salvador","San Salvador"],["Guatemala","Guatemala City"],["Honduras","Tegucigalpa"],["Kyrgyzstan","Bishkek"],["Madagascar","Antananarivo"],["Mauritania","Nouakchott"],["Mauritius","Port Louis"],["Montenegro","Podgorica"],["Mozambique","Maputo"],["Namibia","Windhoek"],["Nicaragua","Managua"],["Niger","Niamey"],["Panama","Panama City"],["Paraguay","Asunción"],["Republic of the Congo","Brazzaville"],["Somalia","Mogadishu"],["South Sudan","Juba"],["Sudan","Khartoum"],["Suriname","Paramaribo"],["Tajikistan","Dushanbe"],["Tanzania","Dodoma"],["Togo","Lomé"],["Trinidad and Tobago","Port of Spain"],["Uganda","Kampala"],["Yemen","Sana’a"]].map(([country,city])=>({country,city,code:WORLD.get(country).code,region:WORLD.get(country).region}));
const pool=GuessGame.util.deck(DATA,x=>x.country);
GuessGame.run({
 id:'capitals',label:'Capital Cities',eyebrow:'A quick world tour',titleHtml:'Know your<br><em>capitals?</em>',
 intro:'You get a country. You name its capital. Find out how much of the world map lives in your head.',
 note:DATA.length+' countries. After five warm-up questions, the wrong answers are capitals from the same continent.',
 previewHtml:'<div class="preview-row"><span class="preview-chip">TOKYO</span><span class="preview-chip">LIMA</span><span class="preview-chip">OSLO</span></div>',
 prompt:'What is the capital of this country?',legacyBest:[{key:'guessTheCapitalsBest',scale:10}],
 links:[{"text":"Flags","href":"../guess-the-flag/"},{"text":"Countries","href":"../guess-the-countries/"},{"text":"Currencies","href":"../guess-the-currencies/"}],
 onStart(){pool.reset()},
 next(ctx){
  const item=pool.draw();
  return {answer:item.city,options:ctx.util.choices(item,DATA,{answer:x=>x.city,group:x=>x.region,hard:ctx.hard}),level:ctx.hard?'Tricky · same continent':'Warm-up',explanation:item.city+' is the capital of '+item.country+'.',
   render(h){const img=document.createElement('img');img.className='clue-backdrop';img.alt='';img.src='../assets/flags/'+item.code+'.webp';img.onerror=()=>img.remove();const shade=document.createElement('div');shade.className='clue-shade';const name=document.createElement('div');name.className='clue-label';name.textContent=item.country;h.append(img,shade,name)}};
 }
});
</script>
</body>
</html>
