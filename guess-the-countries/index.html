<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f7f2">
<meta name="description" content="Guess the country from its rotated outline in sixty seconds.">
<title>Guess the Countries — Guess the ____</title>
<link rel="stylesheet" href="../shared/engine.css">
</head>
<body data-game="countries">
<script src="../shared/engine.js"></script>
<script src="../shared/mode-switch.js"></script>
<script src="../shared/region.js"></script>
<script src="../data/countries.js"></script>
<script>
const DATA=GTQ_DATA.countries.map(([name,continent,path])=>({name,continent,path}));
const BY_NAME=new Map(DATA.map(x=>[x.name,x]));
const TRANSCONTINENTAL=['Russia','Türkiye','Cyprus','Northern Cyprus','Georgia','Armenia','Azerbaijan','Kazakhstan'];
const REGIONS=['Africa','Asia','Europe','North America','South America','Oceania'];
const pool=GuessGame.util.deck(DATA,x=>x.name);
const ANGLES=[23,37,51,68,79,103,119,137,154,206,223,239,253,277,298,319,337];
/* Zoom an answer outline to its own shape so small countries are still visible. */
function fitOutline(svg){setTimeout(()=>{try{const r=svg.querySelector('path').getBBox(),pad=Math.max(r.width,r.height)*.08;svg.setAttribute('viewBox',(r.x-pad)+' '+(r.y-pad)+' '+(r.width+pad*2)+' '+(r.height+pad*2));svg.querySelector('path').style.strokeWidth=Math.max(r.width,r.height)/90}catch(e){}},0)}
function outline(item,angle){return '<svg class="clue-svg" viewBox="0 0 320 260" role="img" aria-label="Country outline rotated '+angle+' degrees"><g transform="rotate('+angle+' 160 130)"><path d="'+item.path+'"/></g></svg>'}
const sample=['Italy','Japan','Chile'].map(n=>DATA.find(x=>x.name===n)).filter(Boolean);
GuessGame.run({
 id:'countries',label:'Countries',eyebrow:'Rotate your world view',titleHtml:'Know your<br><em>countries?</em>',
 intro:'Recognise the outline — even when north is not up. Every question turns the country to a new angle.',
 note:'Outlines from Natural Earth. After five warm-up questions, the wrong answers come from the same continent.',
 previewHtml:'<div class="preview-row">'+sample.map((c,i)=>'<svg viewBox="0 0 320 260" style="width:31%;height:100%" class="clue-svg-preview"><g transform="rotate('+[-22,14,40][i]+' 160 130)"><path d="'+c.path+'" fill="#9bc5a5" stroke="#2d7252" stroke-width="2"/></g></svg>').join('')+'</div>',
 prompt:'Which country is this shape?',legacyBest:[{key:'guessTheCountriesBest',scale:10}],
 links:[{"text":"Flags","href":"../guess-the-flag/"},{"text":"Capital Cities","href":"../guess-the-capitals/"},{"text":"Landmarks","href":"../guess-the-landmarks/"}],
 onStart(){pool.reset()},
formats:['Name the country','Find the outline','Name the continent'],
 next(ctx){
  const item=pool.draw(),angle=ctx.util.pick(ANGLES),level=ctx.hard?'Tricky · same continent':'Warm-up';
  const opts=()=>ctx.util.choices(item,DATA,{answer:x=>x.name,group:x=>x.continent,hard:ctx.hard});
  let f=ctx.format(['name','find','continent']);
  if(f==='continent'&&TRANSCONTINENTAL.includes(item.name))f='name';
  if(f==='find')return {kind:'Find it',answer:item.name,options:opts(),answerText:'the outline of '+item.name,prompt:'Which outline is '+item.name+'?',level,
   render(h){ctx.util.bigClue(h,item.name,item.continent)},
   renderOption(v,b){b.insertAdjacentHTML('beforeend','<svg viewBox="0 0 320 260" aria-hidden="true"><path d="'+BY_NAME.get(v).path+'"/></svg>');fitOutline(b.querySelector('svg'))}};
  if(f==='continent')return {kind:'Continent',answer:item.continent,options:ctx.util.choices({r:item.continent},REGIONS.map(r=>({r})),{answer:x=>x.r}),prompt:'Which continent is this country in?',level:'Where in the world?',explanation:'That outline is '+item.name+'.',
   render(h){h.innerHTML=outline(item,angle)}};
  return {answer:item.name,options:opts(),level,explanation:item.name+' is in '+item.continent+'.',render(h){h.innerHTML=outline(item,angle)}};
 }
});
</script>
</body>
</html>
