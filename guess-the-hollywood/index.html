<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f7f2">
<meta name="description" content="Name the Hollywood film from its story told in emoji, a famous line or a song, in sixty seconds.">
<title>Guess the Hollywood — Guess the ____</title>
<link rel="stylesheet" href="../shared/engine.css">
<style>
.clue-quote{font-family:var(--display);font-weight:950;letter-spacing:-.03em;text-align:center;line-height:1.15;max-width:calc(100% - 32px);overflow-wrap:anywhere}
.clue-quote+.clue-sub{margin-top:10px}
.clue-film{font-family:var(--display);font-weight:1000;letter-spacing:-.04em;text-align:center;line-height:1.05;max-width:calc(100% - 28px);overflow-wrap:anywhere}
.clue-film small{display:block;font-size:14px;font-weight:850;letter-spacing:.08em;color:var(--muted);margin-top:8px}
</style>
</head>
<body data-game="hollywood">
<script src="../shared/engine.js"></script>
<script src="../data/hollywood.js"></script>
<script>
const ERA=y=>y<1990?'classic':y<2000?'90s':y<2010?'2000s':'2010s';
const DATA=GTQ_DATA.hollywood.map(([film,year,cast,song,dialogue,emoji,saidBy])=>({film,year,cast,star:cast[0],song,dialogue,emoji,saidBy:saidBy||'',era:ERA(year)}));
const BY_FILM=new Map(DATA.map(x=>[x.film,x]));
const CHARACTERS=GTQ_DATA.hollywoodCharacters.map(([name,film,actor])=>({name,actor,item:BY_FILM.get(film)}));
/* The two leads of every film, with its era, for wrong answers. (Supporting cast are only ever right answers.) */
const ACTORS=[];DATA.forEach(x=>x.cast.slice(0,2).forEach(a=>ACTORS.push({name:a,era:x.era})));
const pool=GuessGame.util.deck(DATA,x=>x.film),charPool=GuessGame.util.deck(CHARACTERS,x=>x.name);
/* Three actors who are not in this film (same era first once the warm-up is over). */
function otherActors(ctx,item,exclude){
 const bad=new Set(item.cast.concat(exclude||[])),list=ctx.util.shuffle(ACTORS.filter(a=>!bad.has(a.name)));
 const ordered=ctx.hard?list.filter(a=>a.era===item.era).concat(list):list,out=[];
 for(const a of ordered)if(!out.includes(a.name)){out.push(a.name);if(out.length===3)break}
 return out;
}
function filmTitle(h,item,sub){const e=document.createElement('div');e.className='clue-film';e.style.fontSize=item.film.length>22?'clamp(26px,7vw,40px)':'clamp(34px,10vw,56px)';e.textContent=item.film;const y=document.createElement('small');y.textContent=sub||item.year;e.appendChild(y);h.appendChild(e)}
/* Long lines get a smaller font so they fit the clue box on a phone. */
function quote(h,text,sub){
 const q=document.createElement('div');q.className='clue-quote';q.textContent=text;
 q.style.fontSize=text.length>70?'clamp(19px,5vw,26px)':text.length>40?'clamp(23px,6.2vw,34px)':'clamp(28px,8vw,46px)';
 const s=document.createElement('div');s.className='clue-sub';s.textContent=sub;h.append(q,s);
}
GuessGame.run({
 id:'hollywood',label:'Hollywood',pill:'Movies',eyebrow:'Lights, camera, guess!',titleHtml:'Know your<br><em>Hollywood?</em>',
 intro:'Read the story in emoji and name the film. Famous lines, songs, characters, stars and release years are mixed in too.',
 note:DATA.length+' films from 1939 to today. After five warm-up questions, the wrong answers come from the same era.',
 previewHtml:'<div class="preview-row"><span>🚢🧊💑🎨💎🥶</span></div>',
 prompt:'Which film is this from?',
 links:[{"text":"Bollywood","href":"../guess-the-bollywood/"},{"text":"Cuisine","href":"../guess-the-cuisine/"},{"text":"Landmarks","href":"../guess-the-landmarks/"}],
 onStart(){pool.reset();charPool.reset()},
 formats:['Emoji → film','Quote → film','Song → film','Character → film','Film → star','Co-star','Who said it?','Which came first?'],
 next(ctx){
  const item=pool.draw(),level=ctx.hard?'Tricky · same era':'Warm-up';
  const films=()=>ctx.util.choices(item,DATA,{answer:x=>x.film,group:x=>x.era,hard:ctx.hard});
  const label=item.film+' ('+item.year+')';
  // Emoji plots come first and make up about half the questions.
  let f=ctx.format(['emoji','emoji','dialogue','song','character','star','costar','saidby','first']);
  if(f==='saidby'&&!item.saidBy)f='character';
  if(f==='costar'&&item.cast.length<2)f='star';
  if(f==='dialogue'&&!item.dialogue)f=item.song?'song':'emoji';
  if(f==='character'){
   const c=charPool.draw(),it=c.item,lab=it.film+' ('+it.year+')';
   return {kind:'Character',answer:it.film,options:ctx.util.choices(it,DATA,{answer:x=>x.film,group:x=>x.era,hard:ctx.hard}),prompt:'Which film is this character from?',level,
    explanation:c.name+' is from '+lab+(c.actor?', played by '+c.actor:'')+'.',render(h){quote(h,c.name,'Character')}};
  }
  if(f==='first'){
   // Four films from different years (one era once the warm-up is over); the oldest is the answer.
   const src=ctx.util.shuffle(ctx.hard?DATA.filter(x=>x.era===item.era&&x!==item):DATA.filter(x=>x!==item)),picked=[item],years=new Set([item.year]);
   for(const x of src)if(!years.has(x.year)){picked.push(x);years.add(x.year);if(picked.length===4)break}
   if(picked.length===4){
    const sorted=picked.slice().sort((a,b)=>a.year-b.year),first=sorted[0];
    return {kind:'Oldest film',answer:first.film,options:ctx.util.shuffle(picked.map(x=>x.film)),prompt:'Which of these films came out first?',level,
     explanation:sorted.map(x=>x.film+' '+x.year).join(' → ')+'.',render(h){ctx.util.bigClue(h,'📅🎬','Oldest first')}};
   }
   f='star';
  }
  if(f==='costar'){
   const co=item.cast[1];
   return {kind:'Co-star',answer:co,options:ctx.util.shuffle([co].concat(otherActors(ctx,item))),prompt:'Who else stars in this film?',level,
    explanation:co+' stars with '+item.star+' in '+label+'.',render(h){filmTitle(h,item,item.year+' · with '+item.star)}};
  }
  if(f==='saidby')return {kind:'Who said it?',answer:item.saidBy,options:ctx.util.shuffle([item.saidBy].concat(otherActors(ctx,item,[item.saidBy]))),prompt:'Who says this line?',level,
   explanation:item.saidBy+' says it in '+label+'.',render(h){quote(h,'“'+item.dialogue+'”',item.film+' · '+item.year)}};
  if(f==='song'&&!item.song)f=item.dialogue?'dialogue':'emoji';
  if(f==='star'){
   // Anyone else in this film's cast is never offered as a wrong answer.
   return {kind:'Star',answer:item.star,options:ctx.util.shuffle([item.star].concat(otherActors(ctx,item))),prompt:'Who stars in this film?',level,explanation:item.star+' stars in '+label+'.',
    render(h){filmTitle(h,item)}};
  }
  if(f==='dialogue')return {kind:'Quote',answer:item.film,options:films(),prompt:'Which film is this line from?',level,explanation:'That line is from '+label+'.',
   render(h){quote(h,'“'+item.dialogue+'”','Famous line')}};
  if(f==='song')return {kind:'Song',answer:item.film,options:films(),prompt:'Which film is this song from?',level,explanation:'“'+item.song+'” is from '+label+'.',
   render(h){quote(h,'🎵 '+item.song,'Song')}};
  return {kind:'Emoji plot',answer:item.film,options:films(),prompt:'Which film do these emoji describe?',level,explanation:'That was '+label+'.',
   render(h){const e=document.createElement('div');e.className='clue-emoji';e.style.cssText='font-size:clamp(38px,10.5vw,80px);text-align:center;line-height:1.2;max-width:calc(100% - 24px)';e.setAttribute('role','img');e.setAttribute('aria-label','Emoji plot of a film');e.textContent=item.emoji;h.appendChild(e)}};
 }
});
</script>
</body>
</html>
