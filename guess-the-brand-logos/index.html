<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f7f2">
<meta name="description" content="Name the brand from its logo in sixty seconds. The logos get harder as your streak grows.">
<title>Guess the Brand Logos — Guess the ____</title>
<link rel="stylesheet" href="../shared/engine.css">
</head>
<body data-game="brand-logos">
<script src="../shared/engine.js"></script>
<script src="../brand-logos.js"></script>
<script>
const DATA=window.BRAND_LOGOS||[];
const LEVELS=['Easy','Medium','Hard'];
const BY_NAME=new Map(DATA.map(x=>[x.name,x]));
const pool=GuessGame.util.deck(DATA,x=>x.slug);
let level=0;
function svgData(item){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(item.svg)}
const preview=['apple','nike','netflix','spotify'].map(s=>DATA.find(b=>b.slug===s)).filter(Boolean);
GuessGame.run({
 id:'brand-logos',label:'Brand Logos',pill:'Brand spotter',eyebrow:'A quick brand-spotting challenge',titleHtml:'Know your<br><em>brand logos?</em>',
 intro:'You know the logo when you see it. Right? Pick the right brand before the clock runs out.',
 note:'Every 3-answer streak moves you up a difficulty level; a miss moves you down. Unofficial fan-made quiz — brand names and marks belong to their owners.',
 previewHtml:'<div class="preview-row">'+preview.map(b=>'<img src="'+svgData(b)+'" alt="" style="height:44%;object-fit:contain;border:0;border-radius:0">').join('')+'</div>',
 prompt:'Which brand owns this logo?',
 legacyBest:['guessTheBrandLogosBest','guessTheBrandLogosBest-Easy','guessTheBrandLogosBest-Medium','guessTheBrandLogosBest-Hard'].map(key=>({key,scale:1})),
 links:[{text:'Logo icons by Simple Icons',href:'https://simpleicons.org/',external:true},{text:'Colors',href:'../guess-the-color/'},{text:'Flags',href:'../guess-the-flag/'}],
 onStart(){pool.reset();level=0},
formats:['Name the brand','Find the logo'],
 next(ctx){
  const item=pool.draw(b=>b.difficulty===LEVELS[level]);
  const options=ctx.util.choices(item,DATA,{answer:x=>x.name,group:x=>x.difficulty,hard:true});
  if(ctx.format(['name','find'])==='find')return {kind:'Find it',answer:item.name,options,prompt:'Which logo belongs to '+item.name+'?',level:item.difficulty,
   render(h){ctx.util.bigClue(h,item.name,'Find this brand')},
   renderOption(v,b){const img=document.createElement('img');img.alt='';img.src=svgData(BY_NAME.get(v));b.appendChild(img)}};
  return {answer:item.name,options,level:item.difficulty,
   render(h){const img=document.createElement('img');img.className='clue-logo';img.alt='Mystery brand logo';img.src=svgData(item);img.onerror=()=>{h.innerHTML='<span class="clue-fallback">?</span>'};h.appendChild(img)}};
 },
 onAnswer(q,right,ctx){
  if(right&&ctx.streak%3===0&&level<LEVELS.length-1){level++;GuessGame_note('Moving up to '+LEVELS[level]+' logos!')}
  else if(!right&&level>0){level--}
 }
});
function GuessGame_note(text){const fb=document.getElementById('feedback');const s=document.createElement('span');s.className='explain';s.textContent=text;fb.appendChild(s)}
</script>
</body>
</html>
