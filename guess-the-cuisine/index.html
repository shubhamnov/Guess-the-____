<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f7f2">
<meta name="description" content="Dishes from around the world, one photo at a time. Name the dish, then read a quick fact about it.">
<title>Guess the Cuisine — Guess the ____</title>
<link rel="stylesheet" href="../shared/engine.css">
</head>
<body data-game="cuisine">
<script src="../shared/engine.js"></script>
<script>
let CATALOG=[],previous=[];
function extraFormat(){return {}}
GuessGame.run({
 id:'cuisine',label:'Cuisine',eyebrow:"World flavours · Photo quiz",titleHtml:"Guess the <em>dish.</em>",intro:"Dishes from around the world, one photo at a time. Name the dish, then read a quick fact about it.",
 note:'Name as many as you can in 60 seconds, drawn from the verified photo bank. Photos are credited to their creators.',
 previewHtml:'<div class="preview-row"><span>🍣</span><span>🌮</span><span>🍜</span></div>',
 prompt:"Which dish is this?",links:[{"text":"Landmarks","href":"../guess-the-landmarks/"},{"text":"Languages","href":"../guess-the-languages/"},{"text":"Currencies","href":"../guess-the-currencies/"}],
 
 async load(){
  const res=await fetch('../catalogs/cuisines-v1.json');if(!res.ok)throw new Error('Catalog unavailable');
  const data=await res.json();
  CATALOG=(data.questions||[]).filter(q=>q.status==='approved'&&q.image&&q.image.url&&Array.isArray(q.options)&&q.options.includes(q.answer));
  if(!CATALOG.length)throw new Error('No approved questions');
 },
 makeRound(ctx){
  // The whole verified bank in random order; photos that opened the last game go to the back so they repeat least.
  const fresh=ctx.util.shuffle(CATALOG.filter(q=>!previous.includes(q.id))),seen=ctx.util.shuffle(CATALOG.filter(q=>previous.includes(q.id)));
  const round=fresh.concat(seen);previous=round.slice(0,12).map(q=>q.id);
  return round.map((q,i)=>Object.assign({
   answer:q.answer,options:ctx.util.shuffle(q.options),prompt:q.prompt,explanation:q.explanation,clueClass:'photo',level:q.difficulty,
   render(h){const img=document.createElement('img');img.id='photo';img.className='clue-photo';img.alt="Photograph of a dish to identify";img.onerror=()=>{const f=document.createElement('p');f.className='micro';f.innerHTML='This photo could not be loaded. You can still answer, or <a target="_blank" rel="noopener noreferrer">open the image source</a>.';f.querySelector('a').href=q.image.sourcePage;img.replaceWith(f)};img.src='../'+q.image.url.replace(/^(\.\.\/)+/,'');h.appendChild(img);ctx.util.framePhoto(h,img)},
   credit(c){const a=document.createElement('a');a.href=q.image.sourcePage;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Photo: '+q.image.creator+' · '+q.image.license;c.appendChild(a)}
  },extraFormat(q,i,ctx)));
 }
});
</script>
</body>
</html>
