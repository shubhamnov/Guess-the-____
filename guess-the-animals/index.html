<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f7f2">
<meta name="description" content="Identify animals in a 60-second multiple-choice guessing game.">
<title>Guess the Animals — Guess the ____</title>
<link rel="stylesheet" href="../shared/engine.css">
</head>
<body data-game="animals">
<script src="../shared/engine.js"></script>
<script src="../data/animals.js"></script>
<script>
const DATA=GTQ_DATA.animals.map(([name,emoji,group])=>({name,emoji,group}));
const BY_NAME=new Map(DATA.map(x=>[x.name,x]));
const GROUP_QUESTION={mammal:{label:'a mammal',icon:'🐾',not:['bird','reptile','bug']},bird:{label:'a bird',icon:'🪶',not:['mammal','reptile','bug']},reptile:{label:'a reptile or amphibian',icon:'🦎',not:['mammal','bird','bug']},bug:{label:'a creepy-crawly',icon:'🐛',not:['mammal','bird','reptile']}};
const pool=GuessGame.util.deck(DATA,x=>x.name);
GuessGame.run({
 id:'animals',label:'Animals',eyebrow:'A little wild knowledge',titleHtml:'Know your<br><em>animals?</em>',
 intro:'From big cats to ocean creatures, identify as many animals as you can in sixty seconds.',
 note:DATA.length+' animal illustrations. After five warm-up questions, the wrong answers come from the same animal group.',
 previewHtml:'<div class="preview-row"><span>🦊</span><span>🦉</span><span>🐬</span><span>🦒</span></div>',
 prompt:'Which animal is this?',legacyBest:[{key:'guessTheAnimalsBest',scale:10}],
 links:[{"text":"Flags","href":"../guess-the-flag/"},{"text":"Capital Cities","href":"../guess-the-capitals/"},{"text":"Elements","href":"../guess-the-elements/"}],
 onStart(){pool.reset()},
formats:['Name the animal','Find the animal','Spot the group'],
 next(ctx){
  const item=pool.draw(),level=ctx.hard?'Tricky · same group':'Warm-up';
  const opts=()=>ctx.util.choices(item,DATA,{answer:x=>x.name,group:x=>x.group,hard:ctx.hard});
  const f=ctx.format(['name','find','group']);
  if(f==='find')return {kind:'Find it',answer:item.name,options:opts(),answerText:item.emoji+' '+item.name,prompt:'Which one is the '+item.name.toLowerCase()+'?',level,
   render(h){ctx.util.bigClue(h,item.name,'Find this animal')},
   renderOption(v,b){const e=document.createElement('span');e.className='opt-emoji';e.textContent=BY_NAME.get(v).emoji;b.appendChild(e)}};
  if(f==='group'&&GROUP_QUESTION[item.group]){
   // Wrong answers only come from groups that can never also be right (sea creatures include mammals, so they are left out).
   const wrong=ctx.util.shuffle(DATA.filter(x=>GROUP_QUESTION[item.group].not.includes(x.group))).slice(0,3).map(x=>x.name);
   return {kind:'Group',answer:item.name,options:ctx.util.shuffle([item.name].concat(wrong)),prompt:'Which of these is '+GROUP_QUESTION[item.group].label+'?',level:'Odd one in',explanation:item.name+' is '+GROUP_QUESTION[item.group].label+'.',
    render(h){ctx.util.bigClue(h,GROUP_QUESTION[item.group].icon,'Spot '+GROUP_QUESTION[item.group].label)},
    renderOption(v,b){const e=document.createElement('span');e.className='opt-emoji';e.textContent=BY_NAME.get(v).emoji;const n=document.createElement('small');n.textContent=v;b.append(e,n)}};
  }
  return {answer:item.name,options:opts(),level,
   render(h){const e=document.createElement('div');e.className='clue-emoji';e.setAttribute('role','img');e.setAttribute('aria-label','Animal to identify');e.textContent=item.emoji;h.appendChild(e)}};
 }
});
</script>
</body>
</html>
