<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f7f2">
<meta name="description" content="Identify animals in a 60-second multiple-choice guessing game.">
<title>Guess the Animals — Guess the ____</title>
<link rel="stylesheet" href="../shared/engine.css">
</head>
<body data-game="animals">
<script src="../shared/engine.js"></script>
<script>
const DATA=[["Lion","🦁","mammal"],["Tiger","🐯","mammal"],["Leopard","🐆","mammal"],["Wolf","🐺","mammal"],["Fox","🦊","mammal"],["Bear","🐻","mammal"],["Polar bear","🐻‍❄️","mammal"],["Panda","🐼","mammal"],["Koala","🐨","mammal"],["Kangaroo","🦘","mammal"],["Elephant","🐘","mammal"],["Giraffe","🦒","mammal"],["Zebra","🦓","mammal"],["Horse","🐴","mammal"],["Donkey","🫏","mammal"],["Cow","🐄","mammal"],["Buffalo","🐃","mammal"],["Goat","🐐","mammal"],["Sheep","🐑","mammal"],["Pig","🐖","mammal"],["Deer","🦌","mammal"],["Moose","🫎","mammal"],["Rabbit","🐇","mammal"],["Squirrel","🐿️","mammal"],["Hedgehog","🦔","mammal"],["Bat","🦇","mammal"],["Otter","🦦","mammal"],["Beaver","🦫","mammal"],["Seal","🦭","sea"],["Dolphin","🐬","sea"],["Whale","🐳","sea"],["Orca","🐋","sea"],["Shark","🦈","sea"],["Octopus","🐙","sea"],["Squid","🦑","sea"],["Crab","🦀","sea"],["Lobster","🦞","sea"],["Shrimp","🦐","sea"],["Jellyfish","🪼","sea"],["Turtle","🐢","reptile"],["Crocodile","🐊","reptile"],["Snake","🐍","reptile"],["Lizard","🦎","reptile"],["Frog","🐸","reptile"],["Eagle","🦅","bird"],["Owl","🦉","bird"],["Parrot","🦜","bird"],["Flamingo","🦩","bird"],["Penguin","🐧","bird"],["Peacock","🦚","bird"],["Chicken","🐓","bird"],["Duck","🦆","bird"],["Swan","🦢","bird"],["Turkey","🦃","bird"],["Pigeon","🕊️","bird"],["Crow","🐦‍⬛","bird"],["Pelican","🪿","bird"],["Bee","🐝","bug"],["Butterfly","🦋","bug"],["Ant","🐜","bug"],["Spider","🕷️","bug"],["Scorpion","🦂","bug"],["Snail","🐌","bug"],["Pufferfish","🐡","sea"],["Tropical fish","🐠","sea"],["Ladybug","🐞","bug"],["Mosquito","🦟","bug"],["Beetle","🪲","bug"],["Mammoth","🦣","mammal"],["Dromedary camel","🐪","mammal"],["Llama","🦙","mammal"]].map(([name,emoji,group])=>({name,emoji,group}));
const pool=GuessGame.util.deck(DATA,x=>x.name);
GuessGame.run({
 id:'animals',label:'Animals',eyebrow:'A little wild knowledge',titleHtml:'Know your<br><em>animals?</em>',
 intro:'From big cats to ocean creatures, identify as many animals as you can in sixty seconds.',
 note:DATA.length+' animal illustrations. After five warm-up questions, the wrong answers come from the same animal group.',
 previewHtml:'<div class="preview-row"><span>🦊</span><span>🦉</span><span>🐬</span><span>🦒</span></div>',
 prompt:'Which animal is this?',legacyBest:[{key:'guessTheAnimalsBest',scale:10}],
 links:[{"text":"Flags","href":"../guess-the-flag/"},{"text":"Capital Cities","href":"../guess-the-capitals/"},{"text":"Elements","href":"../guess-the-elements/"}],
 onStart(){pool.reset()},
 next(ctx){
  const item=pool.draw();
  return {answer:item.name,options:ctx.util.choices(item,DATA,{answer:x=>x.name,group:x=>x.group,hard:ctx.hard}),level:ctx.hard?'Tricky · same group':'Warm-up',
   render(h){const e=document.createElement('div');e.className='clue-emoji';e.setAttribute('role','img');e.setAttribute('aria-label','Animal to identify');e.textContent=item.emoji;h.appendChild(e)}};
 }
});
</script>
</body>
</html>
