<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f7f2">
<meta name="description" content="A quick country flag quiz. Sixty seconds, four choices, flags from all 195 countries.">
<title>Guess the Flag — Guess the ____</title>
<link rel="stylesheet" href="../shared/engine.css">
</head>
<body data-game="flags">
<script src="../shared/engine.js"></script>
<script src="../shared/mode-switch.js"></script>
<script src="../shared/region.js"></script>
<script src="../shared/world.js"></script>
<script>
const DATA=window.GTQ_WORLD;
const BY_NAME=new Map(DATA.map(x=>[x.name,x]));
const TRANSCONTINENTAL=['Russia','Türkiye','Cyprus','Northern Cyprus','Georgia','Armenia','Azerbaijan','Kazakhstan'];
const REGIONS=['Africa','Asia','Europe','North America','South America','Oceania'];
function flagClue(h,item){const img=document.createElement('img');img.className='clue-flag';img.alt='Flag to identify';img.decoding='async';img.onerror=()=>{img.replaceWith(Object.assign(document.createElement('span'),{className:'clue-fallback',textContent:flagEmoji(item.code)}))};img.src='../assets/flags/'+item.code+'.webp';h.appendChild(img)}
const pool=GuessGame.util.deck(DATA,x=>x.code);
function flagEmoji(code){return String.fromCodePoint.apply(null,code.toUpperCase().split('').map(ch=>127397+ch.charCodeAt(0)))}
GuessGame.run({
 id:'flags',label:'Flags',pill:'Flags · 195 countries',eyebrow:'195 countries · one tiny world tour',titleHtml:'Know your<br><em>flags?</em>',
 intro:'Sixty seconds. Four countries. One flag. How many can you recognise?',
 note:'All 195 country flags are in the pool. After five warm-up questions, the wrong answers come from the same continent.',
 previewHtml:'<div class="preview-row"><img src="../assets/flags/in.webp" alt=""><img src="../assets/flags/jp.webp" alt=""><img src="../assets/flags/br.webp" alt=""></div>',
 prompt:'Which country does this flag belong to?',legacyBest:[{key:'gtq_flag_best',scale:10}],
 links:[{"text":"Capital Cities","href":"../guess-the-capitals/"},{"text":"Countries","href":"../guess-the-countries/"},{"text":"Currencies","href":"../guess-the-currencies/"}],
 onStart(){pool.reset()},
formats:['Name the country','Find the flag','Name the continent'],
 next(ctx){
  const item=pool.draw(),level=ctx.hard?'Tricky · same continent':'Warm-up';
  const opts=()=>ctx.util.choices(item,DATA,{answer:x=>x.name,group:x=>x.region,hard:ctx.hard});
  let f=ctx.format(['name','find','continent']);
  if(f==='continent'&&TRANSCONTINENTAL.includes(item.name))f='name';
  if(f==='find')return {kind:'Find it',answer:item.name,options:opts(),answerText:'the flag of '+item.name,prompt:'Which flag belongs to '+item.name+'?',level,
   render(h){ctx.util.bigClue(h,item.name,item.region)},
   renderOption(v,b){const img=document.createElement('img');img.alt='';img.src='../assets/flags/'+BY_NAME.get(v).code+'.webp';b.appendChild(img)}};
  if(f==='continent')return {kind:'Continent',answer:item.region,options:ctx.util.choices({r:item.region},REGIONS.map(r=>({r})),{answer:x=>x.r}),prompt:'Which continent is this flag from?',level:'Where in the world?',explanation:'That is the flag of '+item.name+'.',
   render(h){flagClue(h,item)}};
  return {answer:item.name,options:opts(),level,explanation:item.name+' is in '+item.region+'.',render(h){flagClue(h,item)}};
 }
});
</script>
</body>
</html>
