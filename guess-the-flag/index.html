<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f7f2">
<meta name="description" content="A quick country flag quiz. Sixty seconds, four choices, flags from all 195 countries.">
<title>Guess the Flag — Guess the ____</title>
<link rel="stylesheet" href="../shared/engine.css">
</head>
<body data-game="flags">
<script src="../shared/engine.js"></script>
<script src="../shared/world.js"></script>
<script>
const DATA=window.GTQ_WORLD;
const pool=GuessGame.util.deck(DATA,x=>x.code);
function flagEmoji(code){return String.fromCodePoint.apply(null,code.toUpperCase().split('').map(ch=>127397+ch.charCodeAt(0)))}
GuessGame.run({
 id:'flags',label:'Flags',pill:'Flags · 195 countries',eyebrow:'195 countries · one tiny world tour',titleHtml:'Know your<br><em>flags?</em>',
 intro:'Sixty seconds. Four countries. One flag. How many can you recognise?',
 note:'All 195 country flags are in the pool. After five warm-up questions, the wrong answers come from the same continent.',
 previewHtml:'<div class="preview-row"><img src="../assets/flags/in.webp" alt=""><img src="../assets/flags/jp.webp" alt=""><img src="../assets/flags/br.webp" alt=""></div>',
 prompt:'Which country does this flag belong to?',legacyBest:[{key:'gtq_flag_best',scale:10}],
 links:[{"text":"Capital Cities","href":"../guess-the-capitals/"},{"text":"Countries","href":"../guess-the-countries/"},{"text":"Currencies","href":"../guess-the-currencies/"}],
 onStart(){pool.reset()},
 next(ctx){
  const item=pool.draw();
  return {answer:item.name,options:ctx.util.choices(item,DATA,{answer:x=>x.name,group:x=>x.region,hard:ctx.hard}),level:ctx.hard?'Tricky · same continent':'Warm-up',explanation:item.name+' is in '+item.region+'.',
   render(h){const img=document.createElement('img');img.className='clue-flag';img.alt='Flag to identify';img.decoding='async';img.onerror=()=>{img.replaceWith(Object.assign(document.createElement('span'),{className:'clue-fallback',textContent:flagEmoji(item.code)}))};img.src='../assets/flags/'+item.code+'.webp';h.appendChild(img)}};
 }
});
</script>
</body>
</html>
