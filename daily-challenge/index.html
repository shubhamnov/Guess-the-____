<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f7f2">
<meta name="description" content="The Daily Mix: 14 questions from seven Guess the ____ games, the same for everyone each day.">
<title>The Daily Mix — Guess the ____</title>
<link rel="stylesheet" href="../shared/engine.css">
</head>
<body data-game="daily-mix">
<script src="../shared/engine.js"></script>
<script src="../daily-challenge-data-v1.js"></script>
<script src="../brand-logos-daily-v1.js"></script>
<script src="../shared/daily-mix-v1.js"></script>
<script>
(function(){
'use strict';
const {todayUTC,validDate,formatDate}=window.DailyMixV1;
const params=new URLSearchParams(window.location.search);
const activeDate=validDate(params.get('date'))?params.get('date'):todayUTC();
function challengeURL(){const url=new URL(window.location.href);url.search='';url.hash='';url.searchParams.set('date',activeDate);return url.toString()}
const isToday=activeDate===todayUTC();

const game=GuessGame.run({
 id:'daily-mix',label:'Daily Mix',pill:'The Daily Mix',autoStart:false,
 // A friend game always plays today's questions, so it is only offered on today's mix.
 liveLink:isToday,friendText:'Play today’s mix with a friend',
 eyebrow:isToday?'Today’s Daily Mix':'Daily Mix · '+formatDate(activeDate),
 titleHtml:'Seven games.<br><em>One daily mix.</em>',
 intro:'Fourteen questions across seven categories — two from each game — and 60 seconds to get through them. The questions are the same for everyone on '+formatDate(activeDate)+' (UTC).',
 note:'🎨 Colors · 🏳️ Flags · 🌍 Countries · 🐾 Animals · 🏙️ Capitals · あ Scripts · ✳ Brand logos',
 prompt:'Which one is it?',legacyBest:[{key:'guessTheDailyMixBest',scale:1}],
 resultLabel:'Daily Mix · '+formatDate(activeDate),shareHeadline:'Daily Mix · '+formatDate(activeDate),
 links:[{text:'Flags',href:'../guess-the-flag/'},{text:'Brand Logos',href:'../guess-the-brand-logos/'}],
 shareUrl:challengeURL,
 resultNote:()=>isToday?'Come back tomorrow for a new mix.':'Today’s mix is waiting on the home page.',
 makeRound(){
  return window.DailyMixV1.questions(activeDate);
 },
 setupIntro({toast,$}){
  const btn=document.createElement('button');btn.type='button';btn.className='secondary';btn.textContent='Share this challenge ↗';
  btn.addEventListener('click',async()=>{
   const text='Play the Guess the ____ Daily Mix for '+formatDate(activeDate)+': '+challengeURL();
   try{if(navigator.share){await navigator.share({title:'Guess the ____ · Daily Mix',text,url:challengeURL()});return}}catch(e){if(e&&e.name==='AbortError')return}
   try{await navigator.clipboard.writeText(text);toast('Challenge link copied. Send it to a friend.')}catch(e){window.prompt('Copy this link and send it to a friend:',challengeURL())}
  });
  ($('friendIntroBtn')||$('startBtn')).after(btn);
 }
});
})();
</script>
</body>
</html>
