<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f7f2">
<meta name="description" content="Recognise writing systems from a short sample in sixty seconds.">
<title>Guess the Scripts — Guess the ____</title>
<link rel="stylesheet" href="../shared/engine.css">
</head>
<body data-game="scripts">
<script src="../shared/engine.js"></script>
<script src="../data/scripts.js"></script>
<script>
const DATA=GTQ_DATA.scripts.map(([name,sample,about,group])=>({name,sample,about,group}));
const BY_NAME=new Map(DATA.map(x=>[x.name,x]));
const pool=GuessGame.util.deck(DATA,x=>x.name);
GuessGame.run({
 id:'scripts',label:'Scripts',eyebrow:'Read the world',titleHtml:'Know your<br><em>scripts?</em>',
 intro:'A short greeting appears in a writing system. Can you tell which script it is?',
 note:DATA.length+' writing systems. After five warm-up questions, the wrong answers come from the same part of the world.',
 previewHtml:'<div class="preview-row"><span style="font-size:clamp(30px,8vw,52px)">नम</span><span style="font-size:clamp(30px,8vw,52px)">γει</span><span style="font-size:clamp(30px,8vw,52px)">مرح</span><span style="font-size:clamp(30px,8vw,52px)">あ</span></div>',
 prompt:'Which writing system is this?',legacyBest:[{key:'guessTheScriptsBest',scale:10}],
 links:[{"text":"Languages","href":"../guess-the-languages/"},{"text":"Flags","href":"../guess-the-flag/"},{"text":"Capital Cities","href":"../guess-the-capitals/"}],
 onStart(){pool.reset()},
formats:['Name the script','Find the script'],
 next(ctx){
  const item=pool.draw(),level=ctx.hard?'Tricky · same region':'Warm-up';
  const options=ctx.util.choices(item,DATA,{answer:x=>x.name,group:x=>x.group,hard:ctx.hard});
  if(ctx.format(['name','find'])==='find')return {kind:'Find it',answer:item.name,options,answerText:'“'+item.sample+'”',prompt:'Which sample is written in '+item.name+'?',level,explanation:item.about,
   render(h){ctx.util.bigClue(h,item.name,'Find this script')},
   renderOption(v,b){const t=document.createElement('span');t.className='opt-text';t.dir='auto';t.textContent=BY_NAME.get(v).sample;b.appendChild(t)}};
  return {answer:item.name,options,level,explanation:item.about,
   render(h){const e=document.createElement('div');e.className='clue-text';e.dir='auto';e.textContent=item.sample;h.appendChild(e)}};
 }
});
</script>
</body>
</html>
