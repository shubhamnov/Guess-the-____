<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f7f2">
<meta name="description" content="Read “thank you” and name the language. Sixty seconds, four choices.">
<title>Guess the Languages — Guess the ____</title>
<link rel="stylesheet" href="../shared/engine.css">
</head>
<body data-game="languages">
<script src="../shared/engine.js"></script>
<script>
const DATA=[["French","Merci","eu"],["Spanish","Gracias","eu"],["German","Danke","eu"],["Italian","Grazie","eu"],["Portuguese","Obrigado","eu"],["Dutch","Dank je","eu"],["Afrikaans","Dankie","af"],["Swedish","Tack","eu"],["Danish","Tak","eu"],["Norwegian","Takk","eu"],["Finnish","Kiitos","eu"],["Estonian","Aitäh","eu"],["Latvian","Paldies","eu"],["Lithuanian","Ačiū","eu"],["Polish","Dziękuję","eu"],["Czech","Děkuji","eu"],["Hungarian","Köszönöm","eu"],["Romanian","Mulțumesc","eu"],["Albanian","Faleminderit","eu"],["Greek","Ευχαριστώ","eu"],["Russian","Спасибо","eu"],["Ukrainian","Дякую","eu"],["Bulgarian","Благодаря","eu"],["Welsh","Diolch","eu"],["Irish","Go raibh maith agat","eu"],["Basque","Eskerrik asko","eu"],["Catalan","Gràcies","eu"],["Maltese","Grazzi","eu"],["Turkish","Teşekkürler","me"],["Arabic","شكرا","me"],["Hebrew","תודה","me"],["Persian","سپاس","me"],["Armenian","Շնորհակալություն","me"],["Georgian","მადლობა","me"],["Hindi","धन्यवाद","sa"],["Bengali","ধন্যবাদ","sa"],["Urdu","شکریہ","sa"],["Tamil","நன்றி","sa"],["Telugu","ధన్యవాదాలు","sa"],["Kannada","ಧನ್ಯವಾದ","sa"],["Malayalam","നന്ദി","sa"],["Gujarati","આભાર","sa"],["Punjabi","ਧੰਨਵਾਦ","sa"],["Sinhala","ස්තූතියි","sa"],["Mandarin Chinese","谢谢","ea"],["Japanese","ありがとう","ea"],["Korean","감사합니다","ea"],["Mongolian","Баярлалаа","ea"],["Vietnamese","Cảm ơn","sea"],["Thai","ขอบคุณ","sea"],["Khmer","អរគុណ","sea"],["Burmese","ကျေးဇူးတင်ပါတယ်","sea"],["Indonesian","Terima kasih","sea"],["Tagalog","Salamat","sea"],["Hawaiian","Mahalo","sea"],["Swahili","Asante","af"],["Zulu","Ngiyabonga","af"],["Amharic","አመሰግናለሁ","af"],["Yoruba","Ẹ ṣé","af"],["Hausa","Na gode","af"]].map(([name,thanks,group])=>({name,thanks,group}));
const pool=GuessGame.util.deck(DATA,x=>x.name);
GuessGame.run({
 id:'languages',label:'Languages',eyebrow:'Say thank you around the world',titleHtml:'Know your<br><em>languages?</em>',
 intro:'Each question shows how to say “thank you” in a different language. Can you tell which one it is?',
 note:DATA.length+' languages. After five warm-up questions, the wrong answers come from the same part of the world.',
 previewHtml:'<div class="preview-row"><span class="preview-chip">Merci</span><span class="preview-chip">ありがとう</span><span class="preview-chip">Asante</span></div>',
 prompt:'Which language says “thank you” like this?',
 links:[{"text":"Scripts","href":"../guess-the-scripts/"},{"text":"Currencies","href":"../guess-the-currencies/"},{"text":"Capital Cities","href":"../guess-the-capitals/"}],
 onStart(){pool.reset()},
 next(ctx){
  const item=pool.draw();
  return {answer:item.name,options:ctx.util.choices(item,DATA,{answer:x=>x.name,group:x=>x.group,hard:ctx.hard}),level:ctx.hard?'Tricky · same region':'Warm-up',explanation:'“'+item.thanks+'” means thank you in '+item.name+'.',
   render(h){const p=document.createElement('div');p.className='clue-phrase';p.dir='auto';p.textContent=item.thanks;const sub=document.createElement('div');sub.className='clue-sub';sub.textContent='“Thank you”';h.append(p,sub)}};
 }
});
</script>
</body>
</html>
