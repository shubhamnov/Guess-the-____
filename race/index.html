<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f7f2">
<meta name="robots" content="noindex">
<meta name="description" content="Play with a friend: live scores on a mix of questions from every category.">
<title>Live Mix — Guess the ____</title>
<link rel="stylesheet" href="../shared/engine.css">
</head>
<body data-game="live-mix">
<script src="../shared/engine.js"></script>
<script src="../shared/mode-switch.js"></script>
<script src="../shared/games.js"></script>
<script src="../shared/mix.js"></script>
<script>
(function(){
'use strict';
/* Live Mix: two players, questions from every category. Live mode itself (rooms, live scores, rematch) is in
 * shared/live.js; this page only supplies the questions (shared/mix.js). See race/README.md. */
GTQMix.load().catch(()=>{});
/* Two questions from every game in shared/games.js. The seed comes from Math.random, which the engine has seeded from
   the room, so both devices draw the same mix. */
function mixQuestions(){return GTQMix.questions('live-mix|'+Math.random(),2)}
GuessGame.run({
 id:'live-mix',label:'Live Mix',pill:'Live · Mix',live:true,
 eyebrow:'⚡ With a friend',
 titleHtml:'Play with<br><em>a friend.</em>',
 intro:'A mix of questions from every game: flags, movies, sports, series, logos and more. You both get the same questions and 60 seconds, and you see each other’s score as you play.',
 prompt:'Which one is it?',
 links:[{text:'Pick one category',href:'../live/'},{text:'Daily Mix',href:'../daily-challenge/'}],
 load:()=>GTQMix.load(),
 makeRound:mixQuestions
});
})();
</script>
</body>
</html>
