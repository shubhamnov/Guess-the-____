<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f7f2">
<meta name="robots" content="noindex">
<meta name="description" content="Race a friend live on today's Daily Mix. Test version.">
<title>Live Race (test) — Guess the ____</title>
<link rel="stylesheet" href="../shared/engine.css">
<style>
[hidden]{display:none!important}
.lobby{display:flex;flex-direction:column;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:16px}
.lobby label{font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.lobby input{font:inherit;font-size:16px;font-weight:800;border:1.5px solid var(--line);border-radius:13px;padding:12px 13px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
.join-row{display:flex;gap:8px}
.join-row input{text-transform:uppercase;letter-spacing:.3em;text-align:center}
.join-row .secondary{width:auto;padding:12px 18px}
.or{font-size:11px;color:var(--muted);text-align:center;font-weight:800}
.room-code{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.room-code strong{font-family:var(--display);font-size:40px;letter-spacing:.18em;color:var(--ink);background:var(--lime);border-radius:13px;padding:2px 10px 4px 16px}
.race-status{font-size:13px;font-weight:800;line-height:1.45;text-align:center;min-height:19px}
.race-status.bad{color:var(--red)}
.race-status.good{color:var(--green)}
.primary:disabled{opacity:.35;cursor:default}
.race-strip{position:relative;display:flex;flex-direction:column;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:9px 11px}
.race-row{display:grid;grid-template-columns:minmax(0,72px) 1fr 52px 40px;align-items:center;gap:8px;font-size:12px;font-weight:850}
.race-row .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.race-row .bar{height:9px;border-radius:9px;background:#efeee7;overflow:hidden}
.race-row .bar i{display:block;height:100%;width:0;border-radius:9px;background:#b9bcb4;transition:width .3s}
.race-row.me .bar i{background:var(--ink)}
.race-row.rival .bar i{background:#7871e8}
.race-row .pts{text-align:right;font-variant-numeric:tabular-nums;transition:color .2s}
.race-row .q{text-align:right;color:var(--muted);font-size:10px}
.race-row.lead .who:after{content:" ▲";color:var(--green)}
.race-row.flash-good .pts{color:var(--green)}
.race-row.flash-bad .pts{color:var(--red)}
.race-row.gone{opacity:.45}
.race-pop{position:absolute;left:50%;top:100%;transform:translate(-50%,6px);z-index:5;background:var(--ink);color:#fff;font-size:12px;font-weight:900;padding:7px 13px;border-radius:99px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.race-pop.show{opacity:1}
.race-pop.warn{background:#7871e8}
.countdown{position:fixed;inset:0;z-index:1500;display:grid;place-items:center;background:rgba(248,247,242,.94)}
.countdown span{font-family:var(--display);font-size:min(40vw,200px);font-weight:1000;letter-spacing:-.06em;animation:pop .8s ease-out}
@keyframes pop{from{transform:scale(1.5);opacity:0}to{transform:scale(1);opacity:1}}
.race-result{display:flex;flex-direction:column;gap:12px}
.race-vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.race-vs>div{border:1.5px solid var(--line);border-radius:16px;padding:12px}
.race-vs>div.win{border-color:var(--ink);background:var(--lime)}
.race-vs label{display:block;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.race-vs strong{display:block;font-family:var(--display);font-size:32px;letter-spacing:-.04em}
.race-vs small{font-size:11px;color:var(--muted);font-weight:800}
.race-result a.primary{text-decoration:none}
</style>
</head>
<body data-game="race">
<script src="../shared/engine.js"></script>
<script src="../daily-challenge-data-v1.js"></script>
<script src="../brand-logos-daily-v1.js"></script>
<script src="../shared/daily-mix-v1.js"></script>
<script src="../shared/vendor/peerjs.min.js"></script>
<script>
(function(){
'use strict';
/* Live race, test version. Two phones connect directly (WebRTC through PeerJS); the free PeerJS service only
 * introduces them. Both play the same Daily Mix questions, see each other's score as they go, and the higher
 * score wins (a tie goes to whoever finished first). No server of our own is involved. See race/README.md. */
const DM=window.DailyMixV1;
const params=new URLSearchParams(location.search);
const ID_PREFIX='gtq-race-v1-';
const CODE_LETTERS='ABCDEFGHJKMNPQRSTUVWXYZ';
const NAME_KEY='gtq:race:name';
const TOTAL=14;
function safeGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function safeSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function newCode(){let c='';for(let i=0;i<4;i++)c+=CODE_LETTERS[Math.floor(Math.random()*CODE_LETTERS.length)];return c}
function cleanCode(v){return String(v||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,4)}
/* ?signal=host:port points at a local PeerJS server (used by the automated test). Normal play uses the free PeerJS cloud. */
function peerOptions(){
 const sig=params.get('signal');
 if(!sig)return {debug:0};
 const [host,port]=sig.split(':');
 return {host,port:Number(port)||9000,path:'/',secure:false,debug:0,config:{iceServers:[]}};
}

const R={role:null,peer:null,conn:null,code:'',date:DM.validDate(params.get('date'))?params.get('date'):DM.todayUTC(),
 phase:'lobby',myName:'',rival:{name:'Friend',score:0,n:0,streak:0,ready:false,done:null,gone:false},
 me:{score:0,n:0,streak:0},mine:null,lead:0};
let game,ui={};

function rivalName(){return R.rival.name||'Friend'}
function myName(){return (ui.name.value||'').trim().slice(0,16)||'Player'}
function status(text,kind){ui.status.textContent=text;ui.status.className='race-status'+(kind?' '+kind:'')}
function send(msg){try{if(R.conn&&R.conn.open)R.conn.send(msg)}catch(e){}}
function inviteURL(){const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('room',R.code);if(params.get('signal'))u.searchParams.set('signal',params.get('signal'));return u.toString()}

/* ---------- Connecting ---------- */
function showRoom(){ui.home.hidden=true;ui.room.hidden=false;ui.codeOut.textContent=R.code;ui.name.disabled=false}
function peerError(err){
 const type=err&&err.type;
 if(R.role==='host'&&type==='unavailable-id'&&R.phase==='lobby'){createRace();return}
 if(type==='peer-unavailable'){status('No race found with code '+R.code+'. Check the code, or ask your friend to send the link again.','bad');backToHome();return}
 if(type==='network'||type==='server-error'||type==='socket-error'||type==='socket-closed'){
  if(R.phase==='playing'||R.phase==='done')return; // the game keeps going over the direct link
  status('Can’t reach the connection service. Check your internet and try again.','bad');return}
 status('Connection problem ('+(type||'unknown')+'). Try again.','bad');
}
function backToHome(){ui.home.hidden=false;ui.room.hidden=true;R.role=null;if(R.peer){try{R.peer.destroy()}catch(e){}R.peer=null}}
function createRace(){
 if(R.peer){try{R.peer.destroy()}catch(e){}}
 R.role='host';R.code=newCode();showRoom();ui.invite.hidden=false;ui.go.hidden=false;ui.go.disabled=true;ui.ready.hidden=true;
 status('Setting up the race…');
 const peer=new Peer(ID_PREFIX+R.code,peerOptions());R.peer=peer;
 peer.on('open',()=>status('Send the invite link (or the code) to your friend. Waiting for them to join…'));
 peer.on('connection',conn=>{
  if(R.conn&&R.conn.open){conn.on('open',()=>{conn.send({t:'full'});setTimeout(()=>conn.close(),300)});return}
  attach(conn);
 });
 peer.on('error',peerError);
}
function joinRace(code){
 R.code=cleanCode(code);
 if(R.code.length!==4){status('Enter the 4-letter code from your friend.','bad');return}
 if(R.peer){try{R.peer.destroy()}catch(e){}}
 R.role='guest';showRoom();ui.invite.hidden=true;ui.go.hidden=true;ui.ready.hidden=true;
 status('Connecting to race '+R.code+'…');
 const peer=new Peer(peerOptions());R.peer=peer;
 peer.on('open',()=>{
  const conn=peer.connect(ID_PREFIX+R.code,{reliable:true});attach(conn);
  setTimeout(()=>{if(!conn.open&&R.phase==='lobby')status('Couldn’t connect. Some office and mobile networks block direct connections; try both phones on the same Wi-Fi.','bad')},15000);
 });
 peer.on('error',peerError);
}
function attach(conn){
 R.conn=conn;R.rival.gone=false;R.rival.ready=false;
 conn.on('open',()=>{if(R.role==='guest')send({t:'hello',name:myName()})});
 conn.on('data',onMessage);
 conn.on('close',onRivalGone);
 conn.on('error',onRivalGone);
}
function onRivalGone(){
 if(R.rival.gone)return;R.rival.gone=true;
 if(R.phase==='lobby'||R.phase==='countdown'){status(rivalName()+' disconnected. Start a new race.','bad');ui.go.disabled=true;ui.ready.hidden=true;return}
 ui.rivalRow.classList.add('gone');ui.rivalQ.textContent='left';
 if(R.phase==='playing')pop(rivalName()+' disconnected','warn');
 renderVerdict();
}

/* ---------- Messages between the phones ---------- */
function onMessage(m){
 if(!m||typeof m!=='object')return;
 if(m.t==='hello'){R.rival.name=String(m.name||'Friend').slice(0,16);send({t:'room',name:myName(),date:R.date});status(rivalName()+' joined. Waiting for them to tap “I’m ready”…','good')}
 else if(m.t==='room'){R.rival.name=String(m.name||'Friend').slice(0,16);if(DM.validDate(m.date))R.date=m.date;ui.ready.hidden=false;status('Connected to '+rivalName()+'’s race. Tap “I’m ready” when you are.','good')}
 else if(m.t==='full'){status('That race already has two players. Ask for a new link.','bad')}
 else if(m.t==='ready'){R.rival.name=String(m.name||R.rival.name).slice(0,16);R.rival.ready=true;ui.go.disabled=false;status(rivalName()+' is ready. Tap “Start the race”.','good')}
 else if(m.t==='start'){R.rival.name=String(m.name||R.rival.name).slice(0,16);countdown()}
 else if(m.t==='answer'){rivalAnswered(m)}
 else if(m.t==='done'){R.rival.done={score:Number(m.score)||0,correct:Number(m.correct)||0,answered:Number(m.answered)||0,seconds:Number(m.seconds)||60};R.rival.score=R.rival.done.score;R.rival.n=R.rival.done.answered;renderStrip();renderVerdict();if(R.phase==='playing')pop(rivalName()+' has finished!','warn')}
}

/* ---------- Start: both phones count down together ---------- */
function countdown(){
 if(R.phase!=='lobby')return;R.phase='countdown';
 const box=ui.countdown,span=box.firstChild;box.hidden=false;
 const steps=['3','2','1','GO'];let i=0;
 const show=()=>{span.textContent=steps[i];span.style.animation='none';void span.offsetWidth;span.style.animation='';
  if(navigator.vibrate&&i===3)navigator.vibrate(60);
  if(++i<steps.length)setTimeout(show,800);else setTimeout(begin,500)};
 show();
}
function begin(){
 ui.countdown.hidden=true;R.phase='playing';
 ui.meName.textContent=myName()+' (you)';ui.rivalName.textContent=rivalName();
 renderStrip();game.start();
}

/* ---------- During the race: live scores and a little pressure ---------- */
function renderStrip(){
 const row=(name,el,p)=>{el.bar.style.width=Math.min(100,p.n/TOTAL*100)+'%';el.pts.textContent=p.score+' pts';if(!R.rival.gone||el!==ui.rivalEls)el.q.textContent='Q'+p.n+'/'+TOTAL};
 row('me',ui.meEls,R.me);row('rival',ui.rivalEls,R.rival);
 const diff=R.me.score-R.rival.score;
 ui.meRow.classList.toggle('lead',diff>0);ui.rivalRow.classList.toggle('lead',diff<0);
}
function flash(rowEl,good){rowEl.classList.remove('flash-good','flash-bad');void rowEl.offsetWidth;rowEl.classList.add(good?'flash-good':'flash-bad');clearTimeout(rowEl._t);rowEl._t=setTimeout(()=>rowEl.classList.remove('flash-good','flash-bad'),700)}
let popTimer=null;
function pop(text,kind){ui.pop.textContent=text;ui.pop.className='race-pop show'+(kind?' '+kind:'');clearTimeout(popTimer);popTimer=setTimeout(()=>ui.pop.classList.remove('show'),1800)}
function checkLead(){
 const diff=R.me.score-R.rival.score,lead=diff>0?1:diff<0?-1:0,was=R.lead;R.lead=lead;
 if(lead===-1&&was!==-1){pop(rivalName()+' overtook you!','warn');if(navigator.vibrate)navigator.vibrate([90,50,90])}
 else if(lead===1&&was!==1&&R.me.n>1)pop('You’re ahead 💪');
}
function rivalAnswered(m){
 R.rival.score=Number(m.score)||0;R.rival.n=Number(m.n)||0;R.rival.streak=Number(m.streak)||0;
 renderStrip();flash(ui.rivalRow,!!m.right);
 if(R.phase!=='playing')return;
 const before=R.lead;checkLead();
 if(R.lead===before&&m.right&&R.rival.streak>=3&&R.rival.streak%2===1)pop(rivalName()+' is on a '+R.rival.streak+'-streak 🔥','warn');
}

/* ---------- Result ---------- */
function winner(){
 const a=R.mine,b=R.rival.done;if(!a||!b)return null;
 if(a.score!==b.score)return a.score>b.score?'me':'rival';
 if(a.seconds!==b.seconds)return a.seconds<b.seconds?'me':'rival';
 return 'draw';
}
function card(el,name,res,isWin){
 el.className=isWin?'win':'';el.replaceChildren();
 const l=document.createElement('label');l.textContent=name;const s=document.createElement('strong');const sm=document.createElement('small');
 if(res){s.textContent=res.score;sm.textContent=res.correct+'/'+res.answered+' right · '+res.seconds.toFixed(1)+'s'}
 else{s.textContent=R.rival.score;sm.textContent=R.rival.gone?'left the race':'still playing · Q'+R.rival.n+'/'+TOTAL}
 el.append(l,s,sm);
}
function renderVerdict(){
 if(!R.mine)return;
 const w=winner();
 card(ui.vsMe,myName()+' (you)',R.mine,w==='me');
 card(ui.vsRival,rivalName(),R.rival.done,w==='rival');
 let text,title;
 if(w==='me'){title='You win! 🏆';text=R.mine.score===R.rival.done.score?'Same score, but you finished first.':'You beat '+rivalName()+' by '+(R.mine.score-R.rival.done.score)+' points.'}
 else if(w==='rival'){title=rivalName()+' wins';text=R.mine.score===R.rival.done.score?'Same score, but '+rivalName()+' finished first.':rivalName()+' won by '+(R.rival.done.score-R.mine.score)+' points.'}
 else if(w==='draw'){title='It’s a draw!';text='Same score, same time.'}
 else if(R.rival.gone){title='Race over';text=rivalName()+' disconnected before finishing.'}
 else{title='Waiting for '+rivalName()+'…';text='Their score updates live.'}
 ui.verdict.textContent=text;document.getElementById('resultTitle').textContent=title;
}

game=GuessGame.run({
 id:'race',label:'Live Race',pill:'Live race · test',autoStart:false,replay:false,pauseWhenHidden:false,
 eyebrow:'Today’s Daily Mix · two players',
 titleHtml:'Race a friend.<br><em>Live.</em>',
 intro:'You both get the same 14 Daily Mix questions and 60 seconds, and you see each other’s score as you play. Higher score wins; if it’s a tie, whoever finished first wins.',
 note:'Test version. Keep this screen open during the race: the clock doesn’t pause. Works best with both phones on the same Wi-Fi.',
 prompt:'Which one is it?',
 links:[{text:'Daily Mix',href:'../daily-challenge/'}],
 makeRound(){return DM.questions(R.date)},
 resultNote:()=>'',
 onAnswer(q,right,ctx){
  R.me={score:ctx.score,n:ctx.answered,streak:ctx.streak};
  send({t:'answer',n:ctx.answered,right,score:ctx.score,streak:ctx.streak});
  renderStrip();flash(ui.meRow,right);checkLead();
 },
 onFinish(res){
  R.phase='done';R.mine={score:res.score,correct:res.correct,answered:res.answered,seconds:res.seconds};
  send({t:'done',score:res.score,correct:res.correct,answered:res.answered,seconds:res.seconds});
  renderVerdict();
 },
 setupIntro({$}){
  $('startBtn').style.display='none';
  $('startBtn').insertAdjacentHTML('afterend',
   '<div class="lobby" id="lobby">'+
   '<label>Your name<input id="nameInput" maxlength="16" autocomplete="nickname" placeholder="Player"></label>'+
   '<div id="lobbyHome" class="lobby"  style="padding:0;border:0;background:none">'+
    '<button class="primary" id="createBtn" type="button">Create a race <span class="arrow">→</span></button>'+
    '<div class="or">or join a friend’s race</div>'+
    '<div class="join-row"><input id="codeInput" maxlength="4" placeholder="CODE" autocapitalize="characters" autocomplete="off" aria-label="Race code"><button class="secondary" id="joinBtn" type="button">Join</button></div>'+
   '</div>'+
   '<div id="lobbyRoom" class="lobby" style="padding:0;border:0;background:none" hidden>'+
    '<div class="room-code">Race code <strong id="roomCode"></strong></div>'+
    '<button class="secondary" id="inviteBtn" type="button">Send invite link ↗</button>'+
    '<button class="primary" id="goBtn" type="button" disabled>Start the race <span class="arrow">→</span></button>'+
    '<button class="primary" id="readyBtn" type="button" hidden>I’m ready <span class="arrow">✓</span></button>'+
   '</div>'+
   '<div class="race-status" id="raceStatus" role="status" aria-live="polite"></div></div>');
  ui={name:$('nameInput'),home:$('lobbyHome'),room:$('lobbyRoom'),codeOut:$('roomCode'),invite:$('inviteBtn'),go:$('goBtn'),ready:$('readyBtn'),status:$('raceStatus')};
  ui.name.value=safeGet(NAME_KEY)||'';
  ui.name.addEventListener('change',()=>safeSet(NAME_KEY,myName()));
  $('createBtn').addEventListener('click',()=>{safeSet(NAME_KEY,myName());createRace()});
  $('joinBtn').addEventListener('click',()=>{safeSet(NAME_KEY,myName());joinRace($('codeInput').value)});
  $('codeInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('joinBtn').click()}});
  ui.invite.addEventListener('click',async()=>{
   const url=inviteURL(),text=myName()+' challenged you to a live Guess the ____ race. Code '+R.code+': '+url;
   try{if(navigator.share){await navigator.share({title:'Race me · Guess the ____',text,url});return}}catch(e){if(e&&e.name==='AbortError')return}
   try{await navigator.clipboard.writeText(text);game.toast('Invite link copied. Send it to your friend.')}catch(e){window.prompt('Copy this link and send it to your friend:',url)}
  });
  ui.ready.addEventListener('click',()=>{safeSet(NAME_KEY,myName());send({t:'ready',name:myName()});ui.ready.hidden=true;ui.name.disabled=true;status('You’re ready. Waiting for '+rivalName()+' to start…','good')});
  ui.go.addEventListener('click',()=>{if(!R.conn||!R.conn.open){status('Your friend isn’t connected.','bad');return}safeSet(NAME_KEY,myName());ui.name.disabled=true;send({t:'start',name:myName()});countdown()});

  // Live score strip above the question.
  const strip=document.createElement('div');strip.className='race-strip';strip.id='raceStrip';
  const mkRow=cls=>{const r=document.createElement('div');r.className='race-row '+cls;const who=document.createElement('span');who.className='who';const bar=document.createElement('span');bar.className='bar';const i=document.createElement('i');bar.appendChild(i);const pts=document.createElement('span');pts.className='pts';const q=document.createElement('span');q.className='q';r.append(who,bar,pts,q);strip.appendChild(r);return {row:r,who,bar:i,pts,q}};
  const me=mkRow('me'),rv=mkRow('rival');
  ui.pop=document.createElement('div');ui.pop.className='race-pop';ui.pop.setAttribute('role','status');ui.pop.setAttribute('aria-live','polite');strip.appendChild(ui.pop);
  Object.assign(ui,{meRow:me.row,meName:me.who,meEls:me,rivalRow:rv.row,rivalName:rv.who,rivalQ:rv.q,rivalEls:rv});
  document.querySelector('#game .track').after(strip);

  // Countdown overlay.
  ui.countdown=document.createElement('div');ui.countdown.className='countdown';ui.countdown.id='countdown';ui.countdown.hidden=true;ui.countdown.appendChild(document.createElement('span'));document.body.appendChild(ui.countdown);

  // Head-to-head result, shown in the results card.
  $('shareBtn').style.display='none';
  const res=document.createElement('div');res.className='race-result';res.id='raceResult';
  res.innerHTML='<p id="raceVerdict"></p><div class="race-vs"><div id="vsMe"></div><div id="vsRival"></div></div><a class="primary" href="./">New race <span class="arrow">↻</span></a>';
  document.querySelector('#result .resultbox').before(res);
  Object.assign(ui,{verdict:$('raceVerdict'),vsMe:$('vsMe'),vsRival:$('vsRival')});

  const room=cleanCode(params.get('room'));
  if(room.length===4){$('codeInput').value=room;joinRace(room)}
 }
});
})();
</script>
</body>
</html>
