<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f7f2">
<meta name="description" content="Sports quiz: cricket, football, tennis, the Olympics, chess, F1 and more. Nicknames, records, venues and champions in sixty seconds.">
<title>Guess the Sports — Guess the ____</title>
<link rel="stylesheet" href="../shared/engine.css">
<style>
.clue-quote{font-family:var(--display);font-weight:950;letter-spacing:-.03em;text-align:center;line-height:1.15;max-width:calc(100% - 32px);overflow-wrap:anywhere}
.clue-quote+.clue-sub{margin-top:10px}
</style>
</head>
<body data-game="sports">
<script src="../shared/engine.js"></script>
<script src="../data/sports.js"></script>
<script>
const D=GTQ_DATA,U=GuessGame.util;
const ICON={Cricket:'🏏',Football:'⚽',Tennis:'🎾',Athletics:'🏃',Swimming:'🏊',Gymnastics:'🤸',Shooting:'🎯',Boxing:'🥊',Badminton:'🏸',Chess:'♟️',Hockey:'🏑',Basketball:'🏀','Formula 1':'🏎️',Golf:'⛳','Ice hockey':'🏒',Kabaddi:'🤼',Wrestling:'🤼',Rugby:'🏉'};
const PLAYERS=D.cricketPlayers.map(([name,country,nick])=>({name,sport:'Cricket',country,nick}))
 .concat(D.sportsPlayers.map(([name,sport,country,nick])=>({name,sport,country,nick})));
const BY_NAME=new Map(PLAYERS.map(p=>[p.name,p]));
const NICKS=PLAYERS.filter(p=>p.nick);
const RECORDS=D.cricketRecords.concat(D.sportsRecords).map(([clue,player])=>({clue,player:BY_NAME.get(player)}));
const VENUES=D.cricketGrounds.map(([name,city,country])=>({name,city,country,sport:'Cricket ground'}))
 .concat(D.sportsVenues.map(([name,city,country])=>({name,city,country,sport:'Venue'})));
const TERMS=D.cricketTerms.map(([meaning,term])=>({meaning,term}));
const WORDS=D.sportsWords.map(([word,sport])=>({word,sport}));
/* Champions: one list per competition; wrong answers come from that competition's teams or cities. */
const IPL_TEAMS=year=>D.iplTeams.filter(t=>!(year<2013&&t==='Sunrisers Hyderabad')&&!(year<2022&&(t==='Gujarat Titans'||t==='Lucknow Super Giants'))).concat(year<=2012?['Deccan Chargers']:[]);
const OLYMPIC_CITIES=[...new Set(D.olympicHosts.map(x=>x[1]))];
const CHAMPS=[]
 .concat(D.cricketWorldCups.map(([year,type,winner])=>({year,answer:winner,icon:'🏏',sub:type==='ODI'?'Men’s Cricket World Cup':'Men’s T20 World Cup',ask:'Who won the '+year+(type==='ODI'?' Cricket World Cup?':' T20 World Cup?'),others:D.cricketTeams})))
 .concat(D.iplWinners.map(([year,team])=>({year,answer:team,icon:'🏏',sub:'IPL champions',ask:'Who won the IPL in '+year+'?',others:IPL_TEAMS(year)})))
 .concat(D.footballWorldCups.map(([year,team])=>({year,answer:team,icon:'⚽',sub:'FIFA World Cup',ask:'Who won the '+year+' FIFA World Cup?',others:D.footballTeams.filter(t=>!(team==='West Germany'&&t==='Germany'))})))
 .concat(D.olympicHosts.map(([year,city])=>({year,answer:city,icon:'🏅',sub:'Summer Olympics',ask:'Which city hosted the '+year+' Summer Olympics?',others:OLYMPIC_CITIES,host:true})));
/* Countries that would also be right for some players: Great Britain/England and West Indies/Jamaica. */
const CLASH={'Great Britain':['England'],'England':['Great Britain'],'West Indies':['Jamaica'],'Jamaica':['West Indies']};
const COUNTRIES=[...new Set(PLAYERS.map(p=>p.country))];
const decks={record:U.deck(RECORDS,x=>x.clue),venue:U.deck(VENUES,x=>x.name),
 term:U.deck(TERMS,x=>x.term),word:U.deck(WORDS,x=>x.word),champ:U.deck(CHAMPS,x=>x.sub+x.year)};
/* Pick a sport first (bigger sports a little more often), then a player from that sport's own pile,
   so cricket, the biggest list, doesn't crowd out the rest. */
function sportPicker(list){
 const sports=[...new Set(list.map(p=>p.sport))],piles={},weights=sports.map(s=>Math.sqrt(list.filter(p=>p.sport===s).length));
 sports.forEach(s=>piles[s]=U.deck(list.filter(p=>p.sport===s),x=>x.name));
 const total=weights.reduce((a,b)=>a+b,0);
 return {draw(){let r=Math.random()*total,i=0;while(r>weights[i]&&i<sports.length-1){r-=weights[i];i++}return piles[sports[i]].draw()},reset(){Object.values(piles).forEach(d=>d.reset())}};
}
decks.player=sportPicker(PLAYERS);decks.nick=sportPicker(NICKS);
function quote(h,text,sub){
 const q=document.createElement('div');q.className='clue-quote';q.textContent=text;
 q.style.fontSize=text.length>60?'clamp(20px,5.4vw,28px)':text.length>32?'clamp(24px,6.6vw,36px)':'clamp(30px,8.5vw,50px)';
 const s=document.createElement('div');s.className='clue-sub';s.textContent=sub;h.append(q,s);
}
function pickOthers(answer,list){return U.shuffle([answer].concat(U.shuffle(list.filter(x=>x!==answer)).slice(0,3)))}
GuessGame.run({
 id:'sports',label:'Sports',pill:'Game on',eyebrow:'Game on!',titleHtml:'Know your<br><em>sports?</em>',
 intro:'Name the star from a nickname or a record. Cricket, football, tennis, the Olympics, chess, F1 and more: players, venues, terms and champions.',
 note:PLAYERS.length+' players across '+new Set(PLAYERS.map(p=>p.sport)).size+' sports. After five warm-up questions, the wrong answers come from the same sport.',
 previewHtml:'<div class="preview-row"><span>🏏⚽🎾🏅</span></div>',
 prompt:'Who is this?',
 links:[{"text":"Bollywood","href":"../guess-the-bollywood/"},{"text":"Capital Cities","href":"../guess-the-capitals/"},{"text":"Flags","href":"../guess-the-flag/"}],
 onStart(){Object.values(decks).forEach(d=>d.reset())},
 formats:['Nickname → player','Record → player','Player → sport','Player → country','Venue → city','Sports words','Champions'],
 next(ctx){
  const level=ctx.hard?'Tricky · same sport':'Warm-up';
  const f=ctx.format(['nick','record','sport','country','venue','term','champ']);
  const players=p=>U.choices(p,PLAYERS,{answer:x=>x.name,group:x=>x.sport,hard:ctx.hard});
  if(f==='record'){
   const r=decks.record.draw(),p=r.player;
   return {kind:'Record',answer:p.name,options:players(p),prompt:'Who is this?',level,explanation:r.clue+': '+p.name+' ('+p.sport+', '+p.country+').',
    render(h){quote(h,r.clue,ICON[p.sport]+' Record')}};
  }
  if(f==='sport'){
   const p=decks.player.draw();
   return {kind:'Sport',answer:p.sport,options:pickOthers(p.sport,D.sportsList),prompt:'Which sport is this star famous for?',level,
    explanation:p.name+': '+p.sport+' ('+p.country+').',render(h){quote(h,p.name,'Player')}};
  }
  if(f==='country'){
   const p=decks.player.draw(),bad=new Set([p.country].concat(CLASH[p.country]||[]));
   const same=U.shuffle([...new Set(PLAYERS.filter(x=>x.sport===p.sport).map(x=>x.country))].filter(c=>!bad.has(c)));
   const rest=U.shuffle(COUNTRIES.filter(c=>!bad.has(c)&&!same.includes(c)));
   const options=U.shuffle([p.country].concat((ctx.hard?same.concat(rest):U.shuffle(same.concat(rest))).slice(0,3)));
   return {kind:'Country',answer:p.country,options,prompt:'Which country does this star play for?',level,
    explanation:p.name+' plays for '+p.country+'.',render(h){quote(h,p.name,ICON[p.sport]+' '+p.sport)}};
  }
  if(f==='venue'){
   const g=decks.venue.draw();
   return {kind:'Venue',answer:g.city,options:U.choices(g,VENUES,{answer:x=>x.city,group:x=>x.country,hard:ctx.hard}),prompt:'Which city is this in?',level,
    explanation:g.name+' is in '+g.city+(g.country==='West Indies'||g.country==='UAE'||g.country==='USA'?'':', '+g.country)+'.',render(h){quote(h,g.name,'🏟️ '+g.sport)}};
  }
  if(f==='term'){
   if(Math.random()<.5){
    const t=decks.term.draw();
    return {kind:'Cricket term',answer:t.term,options:U.choices(t,TERMS,{answer:x=>x.term}),prompt:'What is this called in cricket?',level,
     explanation:t.term+': '+t.meaning.charAt(0).toLowerCase()+t.meaning.slice(1)+'.',render(h){quote(h,t.meaning,'🏏 Cricket term')}};
   }
   const w=decks.word.draw();
   return {kind:'Sports word',answer:w.sport,options:pickOthers(w.sport,D.sportsList),prompt:'Which sport uses this word?',level,
    explanation:'“'+w.word+'” is from '+w.sport+'.',render(h){quote(h,'“'+w.word+'”','📖 Sports word')}};
  }
  if(f==='champ'){
   const c=decks.champ.draw();
   return {kind:'Champions',answer:c.answer,options:pickOthers(c.answer,c.others),prompt:c.ask,level,
    explanation:c.host?c.answer+' hosted the '+c.year+' Summer Olympics'+(c.year===2020?' (held in 2021)':'')+'.':c.answer+' won in '+c.year+' ('+c.sub.replace('IPL champions','IPL')+').',
    render(h){U.bigClue(h,c.icon+' '+c.year,c.sub)}};
  }
  const p=decks.nick.draw();
  return {kind:'Nickname',answer:p.name,options:players(p),prompt:'Whose nickname is this?',level,explanation:'“'+p.nick+'” is '+p.name+' ('+p.sport+', '+p.country+').',
   render(h){quote(h,'“'+p.nick+'”',ICON[p.sport]+' Nickname')}};
 }
});
</script>
</body>
</html>
