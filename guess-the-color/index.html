<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f7f2">
<meta name="description" content="Name the color you see. Sixty seconds, four choices, and the shades get harder as you go.">
<title>Guess the Color — Guess the ____</title>
<link rel="stylesheet" href="../shared/engine.css">
</head>
<body data-game="colors">
<script src="../shared/engine.js"></script>
<script src="../shared/region.js"></script>
<script src="../data/colors.js"></script>
<script>
const DATA=GTQ_DATA.colors.map(([name,hex,tier])=>({name,hex,tier}));
const BY_NAME=new Map(DATA.map(x=>[x.name,x]));
const pool=GuessGame.util.deck(DATA,x=>x.name);
const TIERS=['Warm-up','Getting warm','Sharp eyes','Color nerd'];
function tierFor(seconds){return seconds<10?0:seconds<25?1:seconds<42?2:3}
GuessGame.run({
 id:'colors',label:'Colors',eyebrow:'Trust your eyes',titleHtml:'Know your<br><em>colors?</em>',
 intro:'A shade fills the screen. Name it before the clock runs out — the colors get trickier as time passes.',
 note:DATA.length+' named shades in four difficulty tiers. Wrong answers are always similar shades from a nearby tier.',
 previewHtml:'<div class="preview-row" style="gap:10px;padding:8px">'+['#F44336','#168F91','#E5B52F','#8E44AD'].map(c=>'<i style="display:block;flex:1;height:80%;border-radius:16px;background:'+c+'"></i>').join('')+'</div>',
 prompt:'Which color is this?',legacyBest:[{cookie:'gtq_color_stats',field:'best',scale:10}],
 links:[{"text":"Flags","href":"../guess-the-flag/"},{"text":"Brand Logos","href":"../guess-the-brand-logos/"},{"text":"Elements","href":"../guess-the-elements/"}],
 onStart(){pool.reset()},
formats:['Name the color','Find the color'],
 next(ctx){
  const tier=tierFor(ctx.elapsed),item=pool.draw(c=>c.tier<=tier&&c.tier>=tier-1);
  const near=DATA.filter(c=>Math.abs(c.tier-item.tier)<=1);
  const options=ctx.util.choices(item,near,{answer:x=>x.name,group:x=>x.tier,hard:true});
  if(ctx.format(['name','find'])==='find')return {kind:'Find it',answer:item.name,options,prompt:'Which one is '+item.name.toLowerCase()+'?',level:TIERS[tier],
   render(h){ctx.util.bigClue(h,item.name,'Find this color')},
   renderOption(v,b){const sw=document.createElement('span');sw.className='opt-swatch';sw.style.background=BY_NAME.get(v).hex;b.appendChild(sw)}};
  return {answer:item.name,options,level:TIERS[tier],clueClass:'swatch',
   render(h){h.style.background=item.hex;h.setAttribute('role','img');h.setAttribute('aria-label','Color swatch')}};
 }
});
</script>
</body>
</html>
