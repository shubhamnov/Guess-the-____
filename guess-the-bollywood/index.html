<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f7f2">
<meta name="description" content="Name the Bollywood film from its story told in emoji, a famous dialogue or a song, in sixty seconds.">
<title>Guess the Bollywood — Guess the ____</title>
<link rel="stylesheet" href="../shared/engine.css">
<style>
.clue-quote{font-family:var(--display);font-weight:950;letter-spacing:-.03em;text-align:center;line-height:1.15;max-width:calc(100% - 32px);overflow-wrap:anywhere}
.clue-quote+.clue-sub{margin-top:10px}
.clue-film{font-family:var(--display);font-weight:1000;letter-spacing:-.04em;text-align:center;line-height:1.05;max-width:calc(100% - 28px);overflow-wrap:anywhere}
.clue-film small{display:block;font-size:14px;font-weight:850;letter-spacing:.08em;color:var(--muted);margin-top:8px}
</style>
</head>
<body data-game="bollywood">
<script src="../shared/engine.js"></script>
<script src="../data/bollywood.js"></script>
<script>
const ERA=y=>y<1990?'classic':y<2000?'90s':y<2010?'2000s':'2010s';
const DATA=GTQ_DATA.bollywood.map(([film,year,cast,song,dialogue,emoji])=>({film,year,cast,star:cast[0],song,dialogue,emoji,era:ERA(year)}));
const pool=GuessGame.util.deck(DATA,x=>x.film);
/* Long lines get a smaller font so they fit the clue box on a phone. */
function quote(h,text,sub){
 const q=document.createElement('div');q.className='clue-quote';q.textContent=text;
 q.style.fontSize=text.length>70?'clamp(19px,5vw,26px)':text.length>40?'clamp(23px,6.2vw,34px)':'clamp(28px,8vw,46px)';
 const s=document.createElement('div');s.className='clue-sub';s.textContent=sub;h.append(q,s);
}
GuessGame.run({
 id:'bollywood',label:'Bollywood',pill:'Filmy',eyebrow:'Lights, camera, guess!',titleHtml:'Know your<br><em>Bollywood?</em>',
 intro:'Read the story in emoji and name the film. Famous dialogues, hit songs and stars are mixed in too.',
 note:DATA.length+' films from 1955 to today. After five warm-up questions, the wrong answers come from the same era.',
 previewHtml:'<div class="preview-row"><span>🇬🇧✈️🇨🇭🚂🌻💍</span></div>',
 prompt:'Which film is this from?',
 links:[{"text":"Languages","href":"../guess-the-languages/"},{"text":"Cuisine","href":"../guess-the-cuisine/"},{"text":"Landmarks","href":"../guess-the-landmarks/"}],
 onStart(){pool.reset()},
 formats:['Emoji → film','Dialogue → film','Song → film','Film → star'],
 next(ctx){
  const item=pool.draw(),level=ctx.hard?'Tricky · same era':'Warm-up';
  const films=()=>ctx.util.choices(item,DATA,{answer:x=>x.film,group:x=>x.era,hard:ctx.hard});
  const label=item.film+' ('+item.year+')';
  // Emoji plots come first and make up about half the questions.
  let f=ctx.format(['emoji','emoji','dialogue','song','star']);
  if(f==='dialogue'&&!item.dialogue)f=item.song?'song':'emoji';
  if(f==='song'&&!item.song)f=item.dialogue?'dialogue':'emoji';
  if(f==='star'){
   // Anyone else in this film's cast is never offered as a wrong answer.
   const others=DATA.filter(x=>!item.cast.includes(x.star));
   const wrong=[];
   for(const x of ctx.util.shuffle(ctx.hard?others.filter(o=>o.era===item.era).concat(others):others))if(!wrong.includes(x.star)){wrong.push(x.star);if(wrong.length===3)break}
   return {kind:'Star',answer:item.star,options:ctx.util.shuffle([item.star].concat(wrong)),prompt:'Who stars in this film?',level,explanation:item.star+' stars in '+label+'.',
    render(h){const e=document.createElement('div');e.className='clue-film';e.style.fontSize=item.film.length>22?'clamp(26px,7vw,40px)':'clamp(34px,10vw,56px)';e.textContent=item.film;const y=document.createElement('small');y.textContent=item.year;e.appendChild(y);h.appendChild(e)}};
  }
  if(f==='dialogue')return {kind:'Dialogue',answer:item.film,options:films(),prompt:'Which film is this dialogue from?',level,explanation:'That line is from '+label+'.',
   render(h){quote(h,'“'+item.dialogue+'”','Famous dialogue')}};
  if(f==='song')return {kind:'Song',answer:item.film,options:films(),prompt:'Which film is this song from?',level,explanation:'“'+item.song+'” is from '+label+'.',
   render(h){quote(h,'🎵 '+item.song,'Song')}};
  return {kind:'Emoji plot',answer:item.film,options:films(),prompt:'Which film do these emoji describe?',level,explanation:'That was '+label+'.',
   render(h){const e=document.createElement('div');e.className='clue-emoji';e.style.cssText='font-size:clamp(38px,10.5vw,80px);text-align:center;line-height:1.2;max-width:calc(100% - 24px)';e.setAttribute('role','img');e.setAttribute('aria-label','Emoji plot of a film');e.textContent=item.emoji;h.appendChild(e)}};
 }
});
</script>
</body>
</html>
